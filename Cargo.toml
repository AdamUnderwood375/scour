[package]
name = "scour"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Fast local web scraper & keyless search for LLM agents (Rust CLI + MCP): HTTP-first with headless-Chromium fallback, 5-engine fused search, GitHub/registry shortcuts, focus filtering, size-capped markdown"
repository = "https://github.com/AdamUnderwood375/scour"
readme = "README.md"
keywords = ["scraper", "mcp", "search", "llm", "markdown"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
ammonia = "4.2.4"
anyhow = "1.0.104"
headless_chrome = "1.0.22"
html2md = "0.2.17"
readability = "0.3.0"
scraper = "0.29.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "charset", "http2", "gzip", "brotli", "cookies"] }
rmcp = { version = "3.8.0", features = ["server", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
url = "2.5.8"
futures = "0.3"
base64 = "0.23.1"
encoding_rs = "0.8.44" # already in-tree via reqwest `charset`; decode streamed bodies
lru = "0.19.0"
fs2 = "0.4"
