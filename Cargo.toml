[package]
name = "scour"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fast local web scraper & search (Rust) — single-page, batch, crawl, BM25 focus, keyless search, 1-hour cache"
repository = "https://github.com/AdamUnderwood375/scour"
readme = "README.md"

[dependencies]
ammonia = "4.1.4"
anyhow = "1.0.104"
headless_chrome = "1.0.22"
html2md = "0.2.17"
readability = "0.3.0"
scraper = "0.24"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "charset", "http2", "gzip", "brotli", "cookies"] }
rmcp = { version = "3.1.4", features = ["server", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
url = "2.5.8"
futures = "0.3"
base64 = "0.22"
